{% extends "base.html" %}

{% block title %}تعديل الصنف{% endblock %}
{% block page_title %}تعديل بيانات الصنف{% endblock %}
{%load static %}

{% block content %}
<div class="form-container" style="max-width: 480px; margin: 20px auto;">
  <h3>تعديل بيانات الصنف</h3>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>اسم الصنف</label>
      <input type="text" name="name" value="{{ item.name }}" required class="form-control">
    </div>

    <div class="form-group">
      <label>الكمية</label>
      <input type="number" name="quantity" value="{{ item.quantity }}" required class="form-control">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
  <label>سعر الكرتون (د.إ)</label>
  <!-- 🟢 التأكد من أن name="unit_price" و قيمة value تعتمد على item.unit_price -->
  <input type="number" step="0.01" name="unit_price" value="{{ item.unit_price }}" required class="form-control">
</div>

    <button type="submit" class="btn-primary" style="margin-top: 15px;">حفظ التعديلات</button>
  </form>
</div>
{% endblock %}
