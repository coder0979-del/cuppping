{% extends "base.html" %}
{% block title %}تعيين كلمة مرور جديدة{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 450px; margin: 40px auto; padding: 25px; background: white; border-radius: 10px; border: 1px solid #cbd5e1;">
  {% if validlink %}
    <h3>كلمة المرور الجديدة</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary" style="width: 100%; padding: 10px; background-color: #059669; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;">
        حفظ كلمة المرور الجديدة
      </button>
    </form>
  {% else %}
    <h3 style="color: #dc2626;">رابط غير صالح</h3>
    <p style="color: #64748b;">هذا الرابط قد انتهت صلاحيته أو تم استخدامه مسبقاً.</p>
    <a href="{% url 'password_reset' %}" style="color: #2563eb;">طلب رابط جديد</a>
  {% endif %}
</div>
{% endblock %}
