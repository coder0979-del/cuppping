{% extends "base.html" %}
{% block title %}إعادة تعيين كلمة المرور{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 450px; margin: 40px auto; padding: 25px; background: white; border-radius: 10px; border: 1px solid #cbd5e1;">
  <h3>نسيت كلمة المرور؟</h3>
  <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">
    أدخل بريدك الإلكتروني المسجل وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.
  </p>

  <form method="post">
    {% csrf_token %}
    <div class="form-group" style="margin-bottom: 15px;">
      <label>البريد الإلكتروني</label>
      <input type="email" name="email" required placeholder="example@domain.com" class="form-control" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>
    <button type="submit" class="btn-primary" style="width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
      إرسال رابط التغيير
    </button>
  </form>
</div>
{% endblock %}
