{% extends "base.html" %}

{% block title %}إصدار فاتورة جديدة{% endblock %}
{% block page_title %}إصدار فاتورة جديدة{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0;">
  <h3 style="margin-bottom: 20px; color: #1e293b;">بيانات الفاتورة</h3>

  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: 600;">اختر الموعد / المريض</label>
      <select name="appointment" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
        {% for app in appointments %}
          <option value="{{ app.id }}">{{ app.patient.full_name }} - {{ app.appointment_date }} ({{ app.get_cupping_type_display }})</option>
        {% endfor %}
      </select>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: 600;">المبلغ الإجمالي (د.إ)</label>
      <input type="number" step="0.01" name="total_amount" placeholder="مثال: 250" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: 600;">طريقة الدفع</label>
      <select name="payment_method" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
        <option value="cash">نقداً (كاش)</option>
        <option value="card">بطاقة مصرفية / شبكة</option>
        <option value="paypal">دفع إلكتروني (PayPal)</option>
      </select>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px; font-weight: 600;">حالة الدفع</label>
      <select name="status" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
        <option value="paid">مدفوعة</option>
        <option value="pending">قيد الانتظار</option>
      </select>
    </div>

    <button type="submit" style="width: 100%; padding: 12px; background-color: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">
      إصدار الفاتورة
    </button>
  </form>
</div>
{% endblock %}
